<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Strict Content Security Policy.
      Phantom is a zero-trust E2E messenger — this header is a critical XSS
      and supply-chain mitigation. It blocks any inline script, any third-party
      script, and any network egress except Supabase (relay + realtime).

      - script-src: only same-origin modules; 'wasm-unsafe-eval' for Argon2id WASM.
      - connect-src: Supabase REST/Realtime only; nothing else may exfiltrate data.
      - style-src 'unsafe-inline' is required by Tailwind / shadcn runtime classes.
      - img-src includes data: and blob: for QR codes and decrypted attachments.
      - media-src blob: plays videos decrypted in memory (vanishing groups).
      - frame-ancestors 'none' prevents clickjacking.
      - form-action 'none' prevents form-based exfiltration.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        media-src 'self' blob:;
        font-src 'self' data:;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;
        worker-src 'self' blob:;
        frame-ancestors 'none';
        form-action 'none';
        base-uri 'self';
        object-src 'none';
        upgrade-insecure-requests;
      "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer" />

    <title>Phantom — Zero-knowledge E2E Messenger</title>
    <meta name="description" content="Phantom: end-to-end encrypted messaging. No accounts, no phone number, no metadata. Encrypted on your device. Never on our servers.">
